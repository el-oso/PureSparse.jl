# Environment for benchmark/audit/strictmode_audit.jl, a fast StrictMode audit that needs no
# proof backends. The authoritative AllocCheck/JET proofs run in the test suite through
# StrictModeTest (test/strictmode_guarantees_tests.jl).
[deps]
PureSparse = "ec4be3f8-c56a-4afe-9cdb-3d99b644fbd7"
StrictMode = "0e98b4f4-d0e6-42ac-af0a-707c24852f32"

[sources]
PureSparse = {path = "../.."}

[compat]
StrictMode = "0.5.4"

[preferences.StrictMode]
checks_enabled = true
